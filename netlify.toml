# Netlify: security headers only. Build settings and routing are left to
# Netlify's Next.js auto-detection — overriding `publish` or adding a catch-all
# redirect breaks the framework runtime.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Deliberately NOT restricting script-src / style-src: Next.js emits inline
    # hydration scripts and the visual-editor overrides inject a pre-paint
    # script and <style>, so a strict policy blanks the page. These directives
    # are the ones that are safe here: no framing, no plugins, no <base> hijack,
    # forms and fetches only to this site and the form service.
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co"
